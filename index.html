<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rellotge</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
  </head>
  <body>
    <nav aria-label="Vistes">
      <a href="#clock"
        ><span class="material-icons" aria-hidden="true">schedule</span
        >Rellotge</a
      >
      <a href="#alarm"
        ><span class="material-icons" aria-hidden="true">alarm</span>Alarmes</a
      >
      <a href="#timer"
        ><span class="material-icons" aria-hidden="true">hourglass_empty</span
        >Temporitzador</a
      >
      <a href="#stopwatch"
        ><span class="material-icons" aria-hidden="true">timer</span
        >Cronòmetre</a
      >
    </nav>
    <main>
      <section id="clock">
        <h1>Rellotge</h1>
        <x-clock><time>00:00:00</time></x-clock>
      </section>
      <section id="alarm">
        <h1>Alarmes</h1>
        <x-alarm>
          <template>
            <section class="alarm">
              <input type="time" aria-label="Hora de l'alarma" />
              <button class="start primary material-icons" aria-label="Activar">
                alarm_on
              </button>
              <button class="pause material-icons" aria-label="Pausar">
                alarm_off
              </button>
              <button class="delete material-icons" aria-label="Eliminar">
                delete
              </button>
            </section>
          </template>
          <section class="items"></section>
          <section class="controls">
            <button
              class="add primary material-icons"
              aria-label="Afegir alarma"
            >
              add
            </button>
            <span>Afegeix una alarma</span>
          </section>
        </x-alarm>
      </section>
      <section id="timer">
        <h1>Temporitzador</h1>
        <x-timer>
          <time datetime="PT0S">00:00:00.00</time>
          <section class="timers">
            <label
              >Interval 1<input type="time" value="00:03:00" step="1"
            /></label>
            <label
              >Interval 2<input type="time" value="00:01:00" step="1"
            /></label>
          </section>
          <section class="controls">
            <button class="start primary material-icons" aria-label="Iniciar">
              play_arrow
            </button>
            <button class="pause material-icons" aria-label="Pausar">
              pause
            </button>
            <button class="restart material-icons" aria-label="Reiniciar">
              restart_alt
            </button>
            <button class="loop material-icons" aria-label="Repetir">
              loop
            </button>
            <button class="no-loop material-icons" aria-label="No repetir">
              sync_disabled
            </button>
          </section>
        </x-timer>
      </section>
      <section id="stopwatch">
        <h1>Cronòmetre</h1>
        <x-stopwatch>
          <time datetime="PT0S">00:00:00.00</time>
          <section class="controls">
            <button class="start primary material-icons" aria-label="Iniciar">
              play_arrow
            </button>
            <button class="pause material-icons" aria-label="Pausar">
              pause
            </button>
            <button class="restart material-icons" aria-label="Reiniciar">
              restart_alt
            </button>
          </section>
        </x-stopwatch>
      </section>
    </main>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
